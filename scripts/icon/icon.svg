<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The app icon: the header's wordmark dot on the page colour, with a wallet drawn for this app from plain shapes
       (Roshan's pick from the mockups, 17-11-2026: a body, a note peeking out and a round clasp). No path is copied
       from an icon set: scripts/icon/icon.test.mjs fails if one of lucide's appears here. node scripts/export-icons.mjs
       draws public/icon-192.png, icon-512.png, src/app/apple-icon.png and src/app/favicon.ico from it. Everything sits
       inside the central 80 %, so a launcher that crops the icon keeps it whole: src/app/manifest.ts lists the PNGs as
       maskable too, and src/app/manifest.test.ts fails if any art leaves that zone. -->
  <rect width="512" height="512" fill="#fbf6ec"/>
  <circle cx="266" cy="266" r="168" fill="#4a4336" fill-opacity="0.22"/>
  <circle cx="256" cy="256" r="168" fill="#f6c945" stroke="#4a4336" stroke-width="12"/>
  <g stroke="#1d1b16" stroke-width="16" stroke-linejoin="round">
    <rect x="196" y="176" width="112" height="70" rx="10" fill="#fdf6e3" transform="rotate(-8 252 211)"/>
    <rect x="166" y="210" width="180" height="124" rx="26" fill="#f6c945"/>
    <path d="M288 248h58v48h-58a24 24 0 0 1 0-48z" fill="#fdf6e3"/>
  </g>
  <circle cx="292" cy="272" r="9" fill="#1d1b16"/>
</svg>
