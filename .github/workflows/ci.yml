name: CI

# A pull request that is ready for review (never a draft) runs the quick checks by itself, on opening, on Ready for
# review and on each push after (Roshan, 2026-11-02): lint, types, build, unit tests, and the stack job's db checks when
# the change reaches them; no e2e, no offline check and no real-server journeys. Those run only by hand (Actions → CI →
# Run workflow, or `gh workflow run ci.yml --ref <branch>`), and Claude asks Roshan before starting one. A `changed` run tests what the
# branch changes against main (scripts/ci-affected.mjs, which says why in the job summary); a `full` run tests
# everything, after Roshan's approval.
# The last job posts the verdict on the tested commit: `full-gate` (a full run on every browser and language),
# `partial-check` (a full run narrowed by an option) or `quick-check` (a changed or quick run). Before merging, a ready
# pull request's quick-check is the check; a full run is optional and by hand. No branch protection requires one yet.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      scope:
        description: 'changed: what the branch changes against main. full: everything, and the full-gate check'
        type: choice
        options: [changed, full]
        default: changed
      browsers:
        description: "auto: Chromium for changed, Chromium and the iPhone's WebKit for full"
        type: choice
        options: [auto, chromium, all]
        default: auto
      languages:
        description: 'auto: the default language for changed, all for full (all adds the 375 px tour in every other language)'
        type: choice
        options: [auto, default, all]
        default: auto

permissions:
  contents: read

# A new run on the same branch and scope stops the one before it; a changed run never stops a full one.
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: true

jobs:
  # What this run needs: `run` (anything but notes), `e2e` (none, all, or the specs as Playwright file arguments),
  # `offline`, `db` and `real` (the stack job's db checks and real-server journeys; `stack` is either), the Playwright
  # `projects` argument and the `languages`, and `jobs`, the jobs the gate requires; plus the commit every later job
  # checks out and the lockfile's Playwright version, whose image the browser jobs run in.
  changes:
    # A draft runs nothing: the person is still working on it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      run: ${{ steps.affected.outputs.run }}
      e2e: ${{ steps.affected.outputs.e2e }}
      offline: ${{ steps.affected.outputs.offline }}
      db: ${{ steps.affected.outputs.db }}
      real: ${{ steps.affected.outputs.real }}
      roles: ${{ steps.affected.outputs.roles }}
      stack: ${{ steps.affected.outputs.stack }}
      projects: ${{ steps.affected.outputs.projects }}
      languages: ${{ steps.affected.outputs.languages }}
      repeat_mocked: ${{ steps.affected.outputs.repeat_mocked }}
      repeat_real: ${{ steps.affected.outputs.repeat_real }}
      prove_mocked: ${{ steps.affected.outputs.prove_mocked }}
      prove_real: ${{ steps.affected.outputs.prove_real }}
      jobs: ${{ steps.affected.outputs.jobs }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the selection diffs against main from where the branch left it.
          fetch-depth: 0
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # A version missing from the lockfile fails here, not as an image that doesn't exist.
      - id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The selection's own tests first, with the map's: a broken selection must fail the run, not pick too little.
      - run: npx vitest run scripts/ci-affected.test.mjs
      - id: affected
        env:
          # A pull request's own run is `quick`: `changed` without e2e and the offline check.
          CI_SCOPE: ${{ github.event_name == 'pull_request' && 'quick' || inputs.scope }}
          CI_BROWSERS: ${{ inputs.browsers }}
          CI_LANGUAGES: ${{ inputs.languages }}
        run: node scripts/ci-affected.mjs

  checks:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The workflows themselves: expressions, contexts, job outputs and needs, and their shell scripts (shellcheck),
      # beyond what parsing the YAML catches.
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - run: npm run typecheck
      - run: npm run build
      # The whole unit suite, never `vitest --changed`: that misses changed fixtures, the lockfile and the map's tests.
      - run: npm test

  # The picked specs on one runner, or the whole suite in four shards. Each writes a blob report; e2e-report merges them.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e != 'none'
    runs-on: ubuntu-latest
    # Playwright's own image for the lockfile's version holds every browser and the system libraries they need, so
    # nothing comes from the Ubuntu mirror: on 05-11-2026 it served one shard WebKit's packages at ~37 kB/s, twice, and
    # `playwright install --with-deps` took that shard's whole 30 minutes (runs 42048610913 and 42054650180). The pull
    # shows as "Initialize containers". `resolute` is the runner's Ubuntu (26.04); uid 1001 is the runner's user, who
    # owns the workspace, as in Playwright's CI docs.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-resolute
      options: --user 1001
    # The whole suite has taken 10 to 16 minutes on one runner, and npm ci up to 4.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.e2e == 'all' && '["1/4", "2/4", "3/4", "4/4"]' || '["1/1"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - env:
          SPECS: ${{ needs.changes.outputs.e2e }}
          SHARD: ${{ matrix.shard }}
          PROJECTS: ${{ needs.changes.outputs.projects }}
          # `all` runs the 375 px tour in every offered language besides English (e2e/helpers/languages.ts).
          E2E_LANGUAGES: ${{ needs.changes.outputs.languages }}
        # $SPECS and $PROJECTS stay unquoted: each spec is an argument of its own, and no projects means every project.
        # A quarantined test runs in the quarantine job instead, where it doesn't block.
        run: |
          # shellcheck disable=SC2086
          if [ "$SPECS" = all ]; then
            npx playwright test $PROJECTS --grep-invert @quarantine --shard="$SHARD" --reporter=dot,blob
          else
            npx playwright test $PROJECTS $SPECS --grep-invert @quarantine --reporter=dot,blob
          fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ strategy.job-index }}
          path: blob-report/
          retention-days: 1

  # One HTML report for the e2e run, with each failed test's trace, merged from every shard's blob report.
  e2e-report:
    needs: [changes, e2e]
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 14

  # The service worker in a production build (playwright.offline.config.ts builds and starts it).
  offline:
    needs: changes
    if: needs.changes.outputs.offline == 'true'
    runs-on: ubuntu-latest
    # The same image as e2e, for the same reason: no browser install from the Ubuntu mirror.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-resolute
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: offline
        run: npm run test:offline
      - if: failure() && steps.offline.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-offline
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The local Supabase stack (Docker is on the runner), started once for everything that needs it: the db checks (the
  # migrations in supabase/migrations, then the pgTAP tests in supabase/tests and the account store's contract tests)
  # when the change reaches them; the role and security tests (e2e-real/roles/) when the database, the moderation code
  # or the sign-in code changes, a ready pull request's quick run included; and all the real-server journeys
  # (e2e-real/) in runs started by hand. No secrets: the local stack makes its own keys, and every user is a throwaway
  # account on it.
  stack:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    # The stack's start, the db checks, then the journeys' production build and run.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Only what the tests use: the database, Auth, the REST API and Mailpit.
      - run: npm run supabase:start -- --exclude studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - if: needs.changes.outputs.db == 'true'
        run: npm run test:db
      # The stack's URL, browser key and Mailpit, for the contract tests and the journeys.
      - run: node scripts/supabase-test-env.mjs >> "$GITHUB_ENV"
      # The account store (src/sync/store.ts) and the emailed codes against the same stack, as signed-in users; the codes
      # come from its Mailpit.
      - if: needs.changes.outputs.db == 'true'
        run: npm run test:contract
      # The moderators the role tests sign in as, one per worker, made in the database here on the runner (the browser
      # image has no Docker), and the role matrix held to every function the running database guards for moderators.
      - if: needs.changes.outputs.real == 'true' || needs.changes.outputs.roles == 'true'
        run: node e2e-real/db.mjs seed
      - if: needs.changes.outputs.roles == 'true'
        run: node e2e-real/db.mjs check-matrix
      # The journeys run in Playwright's image, like e2e (no browser install from the Ubuntu mirror), started from here
      # because the stack needs the runner's Docker. `--network host` lets the image reach the stack and serve the app
      # on the runner's own localhost:3210, the port supabase/config.toml lists for passkeys; uid 1001 owns the workspace.
      # A run started by hand runs every journey; a quick run with the role tests picked runs those only.
      - id: real
        if: needs.changes.outputs.real == 'true' || needs.changes.outputs.roles == 'true'
        env:
          PLAYWRIGHT: ${{ needs.changes.outputs.playwright }}
          PROJECTS: ${{ needs.changes.outputs.projects }}
          SPECS: ${{ needs.changes.outputs.real != 'true' && 'e2e-real/roles/' || '' }}
        # $PROJECTS and $SPECS stay unquoted: none means every project, and every spec.
        run: |
          # shellcheck disable=SC2086
          docker run --rm --network host --ipc=host --user 1001 -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e HOME=/tmp -e CI=true -e SUPABASE_TEST_URL -e SUPABASE_TEST_KEY -e SUPABASE_TEST_MAIL_URL \
            "mcr.microsoft.com/playwright:v$PLAYWRIGHT-resolute" \
            npx playwright test -c e2e-real/playwright.config.ts $PROJECTS $SPECS --grep-invert @quarantine
      # The journeys' result kinds (testkit/result-kinds-reporter.mjs) in the job summary, whatever the outcome.
      - if: always() && steps.real.outcome != 'skipped'
        run: |
          if [ -f result-kinds-real.md ]; then cat result-kinds-real.md >> "$GITHUB_STEP_SUMMARY"; fi
      # Traces of the failed journeys: synthetic users on a stack that is gone when the job ends.
      - if: failure() && steps.real.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-real
          path: |
            playwright-report-real/
            test-results/
          retention-days: 14

  # The quarantined tests (`@quarantine`, each with its owner and fix-by date, which `npm test` holds), apart and never
  # blocking: the gate doesn't wait for this job, and a failure here is a note in the summary, not a red run.
  quarantine:
    needs: changes
    if: needs.changes.outputs.e2e != 'none'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-resolute
      options: --user 1001
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - env:
          PROJECTS: ${{ needs.changes.outputs.projects }}
        # $PROJECTS stays unquoted: no projects means every project.
        run: |
          # shellcheck disable=SC2086
          npx playwright test $PROJECTS --grep @quarantine --pass-with-no-tests --reporter=dot

  # The repeat check, in runs started by hand: the test files the branch changes, 10 times at 2 workers, stopping at
  # the first failure. A test that fails once in ten is flaky, whatever its last run said. The mocked ones run in
  # Playwright's image; the real-server ones against a stack of their own, as in the stack job.
  repeat:
    needs: changes
    if: needs.changes.outputs.repeat_mocked != '' || needs.changes.outputs.repeat_real != ''
    runs-on: ubuntu-latest
    # Ten rounds of every changed test, and a code wait of up to 30 s in each real sign-in.
    timeout-minutes: 90
    env:
      PLAYWRIGHT: ${{ needs.changes.outputs.playwright }}
      PROJECTS: ${{ needs.changes.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: needs.changes.outputs.repeat_mocked != ''
        env:
          SPECS: ${{ needs.changes.outputs.repeat_mocked }}
        # $PROJECTS and $SPECS stay unquoted: no projects means every project; each spec is an argument of its own.
        run: |
          # shellcheck disable=SC2086
          docker run --rm --ipc=host --user 1001 -v "$GITHUB_WORKSPACE:/work" -w /work -e HOME=/tmp -e CI=true \
            "mcr.microsoft.com/playwright:v$PLAYWRIGHT-resolute" \
            npx playwright test $PROJECTS $SPECS --repeat-each=10 --workers=2 --max-failures=1 --retries=0 --grep-invert @quarantine
      - if: needs.changes.outputs.repeat_real != ''
        run: npm run supabase:start -- --exclude studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - if: needs.changes.outputs.repeat_real != ''
        run: |
          node scripts/supabase-test-env.mjs >> "$GITHUB_ENV"
      - if: needs.changes.outputs.repeat_real != ''
        run: node e2e-real/db.mjs seed
      - if: needs.changes.outputs.repeat_real != ''
        env:
          SPECS: ${{ needs.changes.outputs.repeat_real }}
        run: |
          # shellcheck disable=SC2086
          docker run --rm --network host --ipc=host --user 1001 -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e HOME=/tmp -e CI=true -e SUPABASE_TEST_URL -e SUPABASE_TEST_KEY -e SUPABASE_TEST_MAIL_URL \
            "mcr.microsoft.com/playwright:v$PLAYWRIGHT-resolute" \
            npx playwright test -c e2e-real/playwright.config.ts $PROJECTS $SPECS --repeat-each=10 --workers=2 --max-failures=1 --grep-invert @quarantine

  # Red before green, in runs started by hand: the saved mutations of the specs a change reaches (a changed spec, a
  # changed mutations file, or changed code a mutation breaks; testkit/changed-proofs.mjs), each applied, tested and put
  # back. It runs on the runner itself, because a migration's mutation resets the stack's database: Chromium only,
  # downloaded from Playwright's own servers (not the Ubuntu mirror; the runner has its libraries).
  red-green:
    needs: changes
    if: needs.changes.outputs.prove_mocked != '' || needs.changes.outputs.prove_real != ''
    runs-on: ubuntu-latest
    # A build and a run per mutation, about 3 minutes each, and two database resets for a migration's: a branch that
    # brings many mutations at once (the first one did, about 26) needs the room.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - if: needs.changes.outputs.prove_mocked != ''
        env:
          SPECS: ${{ needs.changes.outputs.prove_mocked }}
        run: |
          # shellcheck disable=SC2086
          node testkit/red-green.mjs --mutations e2e/mutations --project desktop-chrome $SPECS
      - if: needs.changes.outputs.prove_real != ''
        run: npm run supabase:start -- --exclude studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - if: needs.changes.outputs.prove_real != ''
        run: |
          node scripts/supabase-test-env.mjs >> "$GITHUB_ENV"
      - if: needs.changes.outputs.prove_real != ''
        run: node e2e-real/db.mjs seed
      - if: needs.changes.outputs.prove_real != ''
        env:
          SPECS: ${{ needs.changes.outputs.prove_real }}
        run: |
          # shellcheck disable=SC2086
          node testkit/red-green.mjs --mutations e2e/mutations --config e2e-real/playwright.config.ts \
            --adapter e2e-real/apply-step.mjs --project desktop-chrome $SPECS

  # The run's one verdict, posted as a commit status on the commit it tested, where a pull request shows it (check runs
  # of a manual run don't appear there). `node scripts/ci-affected.mjs verdict` decides it (statusContext, verdict):
  # - `full-gate` only for a full run on every browser and language; a full run narrowed by an option posts
  #   `partial-check`, and a changed or quick run `quick-check`. No branch protection requires any of them yet.
  # - `changes` names the jobs the run needs (`jobs`); each of them must pass: skipped, cancelled or no result is a
  #   failure. A job the run doesn't need passes when it was skipped. A changed or quick run's report merge doesn't count.
  # A job its `if:` skips counts as passed, and a crash in `changes` skips every job after it, so this job reads every
  # result itself.
  gate:
    needs: [changes, checks, e2e, e2e-report, offline, stack, repeat, red-green]
    # Not for a draft, whose run was skipped on purpose.
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    env:
      # The commit `changes` checked out; the run's own commit when `changes` failed before it knew.
      SHA: ${{ needs.changes.outputs.sha || github.sha }}
    steps:
      # Only the script, from the tested commit: the verdict needs Node's built-ins and nothing from npm.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          # A pull request's own run is `quick`, as in `changes`.
          CI_SCOPE: ${{ github.event_name == 'pull_request' && 'quick' || inputs.scope }}
          CI_BROWSERS: ${{ inputs.browsers }}
          CI_LANGUAGES: ${{ inputs.languages }}
        run: node scripts/ci-affected.mjs verdict
      - env:
          GH_TOKEN: ${{ github.token }}
          # A pull request shows statuses on its head commit, not on the merge commit its run checks out and tests.
          STATUS_SHA: ${{ github.event.pull_request.head.sha || env.SHA }}
          CONTEXT: ${{ steps.verdict.outputs.context }}
          STATE: ${{ steps.verdict.outputs.state }}
          DESCRIPTION: ${{ steps.verdict.outputs.description }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" -f state="$STATE" -f context="$CONTEXT" \
            -f target_url="$RUN_URL" -f description="$DESCRIPTION" > /dev/null
          echo "Posted $CONTEXT: $STATE on $STATUS_SHA." | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$STATE" = success ]
