name: CI

# Never starts on its own: only by hand (Actions → CI → Run workflow, or `gh workflow run ci.yml --ref <branch>`), and
# Claude asks Roshan before starting it. It tests what the chosen branch changes against main (scripts/ci-affected.mjs,
# which says why in the job summary), or everything with `full`.
on:
  workflow_dispatch:
    inputs:
      full:
        description: Run everything, not only what the branch changes against main
        type: boolean
        default: false

permissions:
  contents: read

# A new run on the same branch stops the one before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What this run needs: `run` (anything but notes), `e2e` (none, all, or the specs as Playwright file arguments),
  # `offline` and `db`, plus the commit every later job checks out.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      run: ${{ steps.affected.outputs.run }}
      e2e: ${{ steps.affected.outputs.e2e }}
      offline: ${{ steps.affected.outputs.offline }}
      db: ${{ steps.affected.outputs.db }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the selection diffs against main from where the branch left it.
          fetch-depth: 0
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The selection's own tests first, with the map's: a broken selection must fail the run, not pick too little.
      - run: npx vitest run scripts/ci-affected.test.mjs
      - id: affected
        env:
          CI_FULL: ${{ inputs.full }}
        run: node scripts/ci-affected.mjs

  checks:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # The whole unit suite, never `vitest --changed`: that misses changed fixtures, the lockfile and the map's tests.
      - run: npm test

  # The picked specs on one runner, or the whole suite in four shards.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e != 'none'
    runs-on: ubuntu-latest
    # The whole suite has taken 10 to 16 minutes on one runner, and npm ci up to 4.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.e2e == 'all' && '["1/4", "2/4", "3/4", "4/4"]' || '["1/1"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - id: e2e
        env:
          SPECS: ${{ needs.changes.outputs.e2e }}
          SHARD: ${{ matrix.shard }}
        # $SPECS stays unquoted: each spec is an argument of its own.
        run: |
          if [ "$SPECS" = all ]; then
            npx playwright test --shard="$SHARD"
          else
            npx playwright test $SPECS
          fi
      # Only after a failed run: the HTML report and each failed test's trace.
      - if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-e2e-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The service worker in a production build (playwright.offline.config.ts builds and starts it).
  offline:
    needs: changes
    if: needs.changes.outputs.offline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: offline
        run: npm run test:offline
      - if: failure() && steps.offline.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-offline
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The database: the migrations in supabase/migrations on a local Supabase stack (Docker is on the runner), then the
  # pgTAP tests in supabase/tests. No secrets: the local stack makes its own keys.
  db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run supabase:start -- --exclude studio,mailpit
      - run: npm run test:db
      # The app's account store (src/sync/store.ts) against the same stack, as a signed-in user.
      - run: node scripts/supabase-test-env.mjs >> "$GITHUB_ENV"
      - run: npm run test:contract

  # The run's one verdict. A job its `if:` skips counts as passed, and a crash in `changes` skips every job after it,
  # so this job reads every result itself: `changes` must pass, and the rest must pass or be skipped. Not a required
  # check in branch protection: nothing starts on a pull request, so it would wait there forever.
  gate:
    needs: [changes, checks, e2e, offline, db]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")' > /dev/null
