name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # e2e alone has taken 10 to 16 minutes on the same tests, and npm ci up to 4: 20 cut off a run that would pass.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - id: e2e
        run: npm run test:e2e
      - id: offline
        run: npm run test:offline
      # Only after a failed Playwright run: the HTML report and each failed test's trace. The offline check runs only
      # when e2e passed, so the files on disk always belong to the run that failed.
      - if: failure() && (steps.e2e.outcome == 'failure' || steps.offline.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The database: the migrations in supabase/migrations on a local Supabase stack (Docker is on the runner), then the
  # pgTAP tests in supabase/tests. No secrets: the local stack makes its own keys.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run supabase:start -- --exclude studio,mailpit
      - run: npm run test:db
      # The app's account store (src/sync/store.ts) against the same stack, as a signed-in user.
      - run: node scripts/supabase-test-env.mjs >> "$GITHUB_ENV"
      - run: npm run test:contract
